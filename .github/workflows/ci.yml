name: CI - Build & Size Check

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build size (max 2MB)
        run: |
          BUILD_SIZE=$(du -sm dist | cut -f1)
          echo "Build size: ${BUILD_SIZE}MB"

          if [ "$BUILD_SIZE" -gt 2 ]; then
            echo "Build size exceeds 2MB limit"
            exit 1
          else
            echo "Build size is within limit"
          fi
